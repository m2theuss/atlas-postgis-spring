spring.application.name=atlas-postgis-spring
#database connection
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/atlas_db?currentSchema=public}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}

# hibernate and postgis configuration
spring.jpa.database=postgresql

# table generation and logs of it
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.enable_lazy_load_no_trans=true

